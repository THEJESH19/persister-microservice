spring.application.name=persister-microservice
server.port=8082

# Database Configuration (PostgreSQL active)
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=!Swieert
spring.datasource.driver-class-name=org.postgresql.Driver

# Database Configuration (H2 In-Memory - Commented Out)
#spring.datasource.url=jdbc:h2:mem:persister_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
#spring.datasource.username=sa
#spring.datasource.password=
#spring.datasource.driver-class-name=org.h2.Driver

# JPA Config (PostgreSQL active)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Swagger settings
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha

# Actuator settings
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.com.skylo.streaming=DEBUG
